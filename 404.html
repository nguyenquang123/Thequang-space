<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Không Tìm Thấy Trang</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #faf9f6;
            color: #2b2b2b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            font-weight: 300;
        }
        h1 { 
            font-size: clamp(4rem, 10vw, 8rem); 
            font-weight: 300; 
            margin-bottom: 10px; 
            color: #1a1a1a;
        }
        p { 
            margin-bottom: 40px; 
            color: #595959; 
            font-size: 1.1rem;
            max-width: 400px;
            line-height: 1.6;
        }
        a.btn {
            display: inline-block;
            background-color: #7b8a78;
            color: #fff;
            text-decoration: none;
            padding: 15px 35px;
            border-radius: 99px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        a.btn:hover { 
            background-color: #5e6b5b; 
            transform: translateY(-2px);
        }
        
        .space-container {
            position: relative;
            width: clamp(300px, 80vw, 450px);
            height: clamp(300px, 80vw, 450px);
            background-color: #faf9f6;
            border-radius: 50%;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            margin: 0 auto 40px auto;
            overflow: hidden;
        }

        /* Characters inside the single circle */
        .astronaut, .saturn {
            position: absolute;
            object-fit: cover;
            mix-blend-mode: darken; /* Ensures seamless background blending */
        }
        
        .astronaut {
            width: 50%;
            height: 50%;
            left: 5%;
            top: 25%;
            /* Human astronaut arrives first, then floats */
            opacity: 0;
            animation: 
                arrive 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards,
                floating 3s ease-in-out infinite 1.5s;
        }

        .saturn {
            width: 55%;
            height: 55%;
            right: 0%;
            top: 15%;
            /* Saturn cat is already there, just floating */
            animation: floating 4s ease-in-out infinite 0.5s;
        }
        
        @keyframes arrive {
            0% { opacity: 0; transform: translate(-80px, 30px) rotate(-10deg); }
            100% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
        }

        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>
    <div class="space-container">
        <img src="./assets/404-astronaut.jpg" alt="Lost Astronaut" class="astronaut">
        <img src="./assets/404-saturn-cat.jpg" alt="Cute Saturn Cat" class="saturn">
    </div>
    <h1>Oops!</h1>
    <p>Trang bạn tìm kiếm không tồn tại, hoặc tính năng này đang được chúng tôi nâng cấp và bảo trì.</p>
    <a href="https://thequang.space/" class="btn">Quay về Trái Đất (Trang chủ)</a>
</body>
</html>
