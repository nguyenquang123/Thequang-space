<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Không Tìm Thấy Trang</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #faf9f6;
            color: #2b2b2b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            font-weight: 300;
        }
        h1 { 
            font-size: clamp(4rem, 10vw, 8rem); 
            font-weight: 300; 
            margin-bottom: 10px; 
            color: #1a1a1a;
        }
        p { 
            margin-bottom: 40px; 
            color: #595959; 
            font-size: 1.1rem;
            max-width: 400px;
            line-height: 1.6;
        }
        a.btn {
            display: inline-block;
            background-color: #7b8a78;
            color: #fff;
            text-decoration: none;
            padding: 15px 35px;
            border-radius: 99px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        a.btn:hover { 
            background-color: #5e6b5b; 
            transform: translateY(-2px);
        }
        
        .space-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        /* Floating Animation for Characters */
        .astronaut, .saturn {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        
        .astronaut {
            animation: floating 3s ease-in-out infinite;
        }

        .saturn {
            animation: floating 4s ease-in-out infinite 1s; /* Different timing and delay */
            width: 150px;
            height: 150px;
        }
        
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        @media (max-width: 600px) {
            .space-container {
                flex-direction: row; /* Keep them side by side on mobile */
                gap: 10px;
            }
            .astronaut { width: 140px; height: 140px; }
            .saturn { width: 100px; height: 100px; }
        }
    </style>
</head>
<body>
    <div class="space-container">
        <img src="./assets/404-astronaut.jpg" alt="Lost Astronaut" class="astronaut">
        <img src="./assets/404-saturn.jpg" alt="Cute Saturn" class="saturn">
    </div>
    <h1>Oops!</h1>
    <p>Trang bạn tìm kiếm không tồn tại, hoặc tính năng này đang được chúng tôi nâng cấp và bảo trì.</p>
    <a href="https://thequang.space/" class="btn">Quay về Trái Đất (Trang chủ)</a>
</body>
</html>
