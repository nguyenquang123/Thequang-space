<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Không Tìm Thấy Trang</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #faf9f6;
            color: #2b2b2b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            font-weight: 300;
        }
        h1 { 
            font-size: clamp(4rem, 10vw, 8rem); 
            font-weight: 300; 
            margin-bottom: 10px; 
            color: #7b8a78; /* Soft pastel green matching the button */
        }
        p { 
            margin-bottom: 40px; 
            color: #595959; 
            font-size: 1.1rem;
            max-width: 400px;
            line-height: 1.6;
        }
        a.btn {
            display: inline-block;
            background-color: #7b8a78;
            color: #fff;
            text-decoration: none;
            padding: 15px 35px;
            border-radius: 99px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        a.btn:hover { 
            background-color: #5e6b5b; 
            transform: translateY(-2px);
        }
        
        /* Floating Animation for Scene */
        .scene {
            width: clamp(250px, 70vw, 400px);
            object-fit: contain;
            margin-bottom: 20px;
            animation: floating 4s ease-in-out infinite;
            mix-blend-mode: darken; /* Ensures any background seamlessly blends into the page */
        }
        
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>
    <img src="./assets/404-astronaut-saturn.png" alt="Lost in Space" class="scene">
    <h1>Oops!</h1>
    <p>Trang bạn tìm kiếm không tồn tại, hoặc tính năng này đang được chúng tôi nâng cấp và bảo trì.</p>
    <a href="https://thequang.space/" class="btn">Quay về Trái Đất (Trang chủ)</a>
</body>
</html>
